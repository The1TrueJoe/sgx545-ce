# A Debian kernel package for Cedarview desktops: Debian's own config, gma500
# with the SGX auxiliary device, powervr_sgx. Installs next to Debian's kernel
# (local version -sgx), so the stock kernel stays in GRUB for rollback.
name: powervr-sgx-deb

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Debian suite whose kernel config to start from
        default: trixie
      lockdep:
        description: Lock checking (drm/ci/lockdep.fragment); its own release name and artifact
        type: boolean
        default: false
  push:
    branches: [m2-drm]
    paths:
      - drm/ci/deb-kernel.sh
      - drm/ci/deb.fragment
      - drm/gma500/**
      - drm/powervr_sgx/**
      - .github/workflows/powervr-sgx-deb.yml

concurrency:
  group: powervr-sgx-deb-${{ github.ref }}-${{ inputs.lockdep && 'lockdep' || 'plain' }}
  cancel-in-progress: false

env:
  LINUX_VERSION: 7.3.3
  FLAVOR: ${{ inputs.lockdep && '-lockdep' || '' }}

jobs:
  deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libdw-dev libssl-dev cpio ccache dpkg-dev fakeroot rsync kmod debhelper

      - name: Restore the kernel tarball
        uses: actions/cache@v4
        with:
          path: linux-${{ env.LINUX_VERSION }}.tar.xz
          key: linux-${{ env.LINUX_VERSION }}

      - name: Lay out the kernel
        env:
          DEB_SUITE: ${{ inputs.suite || 'trixie' }}
          EXTRA_FRAGMENTS: ${{ inputs.lockdep && format('{0}/drm/ci/lockdep.fragment', github.workspace) || '' }}
        run: |
          set -eux
          [ -f linux-$LINUX_VERSION.tar.xz ] ||
            curl -sfLO https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-$LINUX_VERSION.tar.xz
          tar xf linux-$LINUX_VERSION.tar.xz
          sh drm/ci/deb-kernel.sh "$PWD/linux-$LINUX_VERSION" "$PWD/drm"

      - name: Build the packages
        env:
          DEBEMAIL: joseph@telaak.dev
          DEBFULLNAME: Joseph Telaak
        run: |
          set -eux
          make -C linux-$LINUX_VERSION ARCH=x86_64 -j"$(nproc)" LOCALVERSION=-sgx$FLAVOR \
            KDEB_PKGVERSION=$LINUX_VERSION-sgx1 bindeb-pkg
          mkdir -p out
          mv linux-image-*.deb linux-headers-*.deb out/
          ls -l out

      - name: Check the packages
        run: |
          set -eux
          L=linux-$LINUX_VERSION
          # The display stays with gma500 (KMS and fbdev), rendering goes to powervr_sgx.
          for want in CONFIG_DRM_GMA500=m CONFIG_DRM_POWERVR_SGX=m CONFIG_DRM_POWERVR_SGX_GMA500=y \
              CONFIG_DRM_FBDEV_EMULATION=y CONFIG_AUXILIARY_BUS=y; do
            grep -qx "$want" $L/.config || { echo "missing $want"; exit 1; }
          done
          [ -z "$FLAVOR" ] || grep -qx CONFIG_PROVE_LOCKING=y $L/.config
          rm -rf root && mkdir root && dpkg-deb -x out/linux-image-*.deb root
          M=$(ls -d root/lib/modules/*)
          for m in gma500_gfx powervr_sgx; do
            find $M -name "$m.ko*" | grep -q . || { echo "no $m module"; exit 1; }
          done
          P=$(find $M -name 'powervr_sgx.ko*')
          modinfo $P | tee modinfo.txt
          grep -q '^alias: *auxiliary:gma500_gfx.sgx' modinfo.txt
          grep -q '^alias: *pci:v00008086d0000089B' modinfo.txt
          grep -q '^firmware: *powervr_sgx/sgx545_ukernel.bin' modinfo.txt
          # udev loads powervr_sgx when gma500 publishes the SGX.
          depmod -b root "$(basename $M)"
          grep -q 'gma500_gfx.sgx' $M/modules.alias
          # gma500 can export scanout buffers (0002).
          G=$(find $M -name 'gma500_gfx.ko*')
          case $G in *.zst) zstd -dq $G -o g.ko ;; *.xz) xz -dc $G > g.ko ;; *) cp $G g.ko ;; esac
          nm g.ko | grep -q psb_gem_prime_get_sg_table

      - uses: actions/upload-artifact@v4
        with:
          name: powervr-sgx-deb-cedarview${{ env.FLAVOR }}
          path: out/
          retention-days: 30
