# After a release is published: install it from the live apt repository in a clean
# Debian 13 container, amd64 and i386, and check every SHA256SUMS entry against
# the release's served files. docs/RELEASING.md.
name: apt-smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: the published release to check (v0.2.0)
        required: true

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Install from https://telaak.dev/powervr_sgx
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          v=$(printf '%s' "${TAG#v}" | tr '-' '~')
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl gnupg kmod
          curl -fsSLo /usr/share/keyrings/powervr-sgx.gpg https://telaak.dev/powervr_sgx/powervr-sgx.gpg
          gpg --show-keys --with-colons /usr/share/keyrings/powervr-sgx.gpg | grep -q '^fpr:*5C26DC64CAEC63910424E220E0DD2B7AD794C167:'
          printf 'Types: deb\nURIs: https://telaak.dev/powervr_sgx\nSuites: trixie\nComponents: main\nSigned-By: /usr/share/keyrings/powervr-sgx.gpg\n' \
            > /etc/apt/sources.list.d/powervr-sgx.sources
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y linux-image-7.3.3-sgx sgx545-firmware mesa-sgx mesa-sgx:i386
          dpkg -l 'linux-image-7.3.3-sgx' sgx545-firmware 'mesa-sgx*' | grep '^ii' | tee installed.txt
          [ "$(grep -c "$v" installed.txt)" = 4 ]
          test -e /opt/sgx/lib/dri/gma500_dri.so
          test -e /opt/sgx/lib/i386-linux-gnu/dri/gma500_dri.so

  assets:
    runs-on: ubuntu-24.04
    steps:
      - name: Every SHA256SUMS entry is a served file that matches
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eux
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D rel
          cd rel
          sha256sum -c SHA256SUMS
          awk '{print $2}' SHA256SUMS | sort > listed.txt
          ls *.deb | sort > served.txt
          diff listed.txt served.txt
