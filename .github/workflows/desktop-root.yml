# The desktop test root (mesa/tests/desktop): Debian bookworm amd64 with Xorg,
# Xfce, a terminal and two browsers, built by mmdebstrap (maintainer scripts
# run), as a tarball artifact. Our Mesa is not in it: the box puts the build in
# /opt/sgx.
name: desktop-root

on:
  workflow_dispatch:
  push:
    branches: [um-re]
    paths:
      - mesa/tests/desktop/packages.txt
      - .github/workflows/desktop-root.yml

permissions:
  contents: read

jobs:
  root:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mmdebstrap debian-archive-keyring zstd

      - name: The root
        run: |
          set -eux
          pkgs=$(grep -v '^#' mesa/tests/desktop/packages.txt | grep . | paste -sd, -)
          sudo mmdebstrap --variant=apt --architectures=amd64 \
            --keyring=/usr/share/keyrings/debian-archive-keyring.gpg \
            --include="$pkgs" \
            --dpkgopt='path-exclude=/usr/share/doc/*' --dpkgopt='path-exclude=/usr/share/man/*' \
            --dpkgopt='path-exclude=/usr/share/info/*' \
            --customize-hook='chroot "$1" useradd -m -u 1000 -s /bin/bash -G video,input,render,audio desk' \
            --customize-hook='rm -rf "$1"/var/cache/apt/* "$1"/var/lib/apt/lists/*' \
            bookworm root.tar http://deb.debian.org/debian
          sudo chown "$(id -u)" root.tar
          ls -l root.tar
          zstd -T0 -12 --rm root.tar -o desktop-root-bookworm.tar.zst
          ls -l desktop-root-bookworm.tar.zst
          sha256sum desktop-root-bookworm.tar.zst | tee desktop-root-bookworm.tar.zst.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-root-bookworm
          path: desktop-root-bookworm.tar.zst*
          compression-level: 0
          retention-days: 30
