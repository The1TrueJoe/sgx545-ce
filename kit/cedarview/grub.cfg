set timeout=5
set default=0
if [ "$grub_platform" = "efi" ]; then set gfxpayload=keep; fi
menuentry "SGX545 GPU test @VERSION@ (only reads; changes nothing on this computer)" {
	linux /boot/bzImage root=PARTUUID=@DISKID@-02 rootfstype=squashfs ro rootwait init=/sbin/kit-init noresume quiet loglevel=3 console=tty1
}
