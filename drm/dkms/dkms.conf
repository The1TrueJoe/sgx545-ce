# DKMS build of powervr_sgx against the running distribution kernel (7.1 or
# later; compat.sh patches the copy for kernels before 7.3). Make the source
# tree with drm/dkms/mkdkms.sh, not from a checkout: the shared stream files
# are symlinks there.
PACKAGE_NAME="powervr_sgx"
PACKAGE_VERSION="@VERSION@"
BUILT_MODULE_NAME[0]="powervr_sgx"
DEST_MODULE_LOCATION[0]="/updates/dkms"
PRE_BUILD="compat.sh ${kernel_source_dir} ."
# kbuild directly: DKMS 3.4 passes KERNELRELEASE to make, which would send the
# Makefile down its kbuild branch with no modules target
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build CONFIG_DRM_POWERVR_SGX=m modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
AUTOINSTALL="yes"
