set timeout=10
set default=0
if [ "$grub_platform" = "efi" ]; then set gfxpayload=keep; fi
# The same test in each entry; 2-4 are fallbacks for a panel that stays dark with the first.
# Every line ends in systemd.show_status=0 (qemu-test.sh appends its options there).
menuentry "1. SGX545 test @VERSION@ (Debian 13 from this stick; changes nothing on this computer)" {
	linux /live/vmlinuz boot=live live-media=removable live-media-path=/live components noresume kit.entry=1 drm.debug=0x6 log_buf_len=4M quiet loglevel=3 systemd.show_status=0
	initrd /live/initrd.img
}
menuentry "2. The same, if the screen went dark with 1 (acpi_backlight=native)" {
	linux /live/vmlinuz boot=live live-media=removable live-media-path=/live components noresume kit.entry=2 acpi_backlight=native drm.debug=0x6 log_buf_len=4M quiet loglevel=3 systemd.show_status=0
	initrd /live/initrd.img
}
menuentry "3. The same, if the screen went dark with 2 (acpi_backlight=vendor)" {
	linux /live/vmlinuz boot=live live-media=removable live-media-path=/live components noresume kit.entry=3 acpi_backlight=vendor drm.debug=0x6 log_buf_len=4M quiet loglevel=3 systemd.show_status=0
	initrd /live/initrd.img
}
menuentry "4. The same, if the screen went dark with 3 (video=LVDS-1:e)" {
	linux /live/vmlinuz boot=live live-media=removable live-media-path=/live components noresume kit.entry=4 video=LVDS-1:e drm.debug=0x6 log_buf_len=4M quiet loglevel=3 systemd.show_status=0
	initrd /live/initrd.img
}
