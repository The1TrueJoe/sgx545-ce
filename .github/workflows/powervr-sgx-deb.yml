# Debian kernel packages for Cedarview: Debian's own config, gma500 with the SGX
# auxiliary device, powervr_sgx. Two flavors, from the same tree:
#   release  linux-image-<v>-sgx      artifact powervr-sgx-deb-cedarview-release  (what people install)
#   kit      linux-image-<v>-sgx-kit  artifact powervr-sgx-deb-cedarview-kit      (test-kit sticks only:
#            adds drm/ci/kit's display register dump and cdv_sr/cdv_dsparb switches)
# Each installs next to Debian's kernel, so the stock kernel stays in GRUB for rollback.
# release.yml calls this (workflow_call) with flavor release and its own pkg_version.
name: powervr-sgx-deb

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      flavor:
        description: release, kit, or empty for both
        type: string
        default: ''
      pkg_version:
        description: Debian package version (KDEB_PKGVERSION); empty for a snapshot, <linux>-sgx0~git<date>.<commit>
        type: string
        default: ''
      suite:
        description: Debian suite whose kernel config to start from
        type: string
        default: trixie
      lockdep:
        description: Lock checking (drm/ci/lockdep.fragment); its own artifact
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      flavor:
        description: release, kit, or empty for both
        default: ''
      pkg_version:
        description: Debian package version (KDEB_PKGVERSION); empty for a snapshot, <linux>-sgx0~git<date>.<commit>
        default: ''
      suite:
        description: Debian suite whose kernel config to start from
        default: trixie
      lockdep:
        description: Lock checking (drm/ci/lockdep.fragment); its own artifact
        type: boolean
        default: false
  push:
    branches: [m2-drm]
    paths:
      - drm/ci/deb-kernel.sh
      - drm/ci/deb.fragment
      - drm/gma500/**
      - drm/shmem/**
      - drm/ci/kit/**
      - drm/powervr_sgx/**
      - .github/workflows/powervr-sgx-deb.yml

env:
  LINUX_VERSION: 7.3.3
  LOCKDEP: ${{ inputs.lockdep && '-lockdep' || '' }}

jobs:
  deb:
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(inputs.flavor && format('["{0}"]', inputs.flavor) || '["release","kit"]') }}
    concurrency:
      group: powervr-sgx-deb-${{ github.ref }}-${{ matrix.flavor }}-${{ inputs.lockdep && 'lockdep' || 'plain' }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      DEB_KIT: ${{ matrix.flavor == 'kit' && '1' || '0' }}
      PKG_VERSION: ${{ inputs.pkg_version }}
      # -sgx for release, -sgx-kit for the kit; -lockdep after either.
      FLAVOR: ${{ matrix.flavor == 'kit' && '-kit' || '' }}${{ inputs.lockdep && '-lockdep' || '' }}
      PKGTAG: ${{ matrix.flavor == 'kit' && 'sgxkit' || 'sgx' }}
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libdw-dev libssl-dev cpio ccache dpkg-dev fakeroot rsync kmod debhelper

      - name: Restore the kernel tarball
        uses: actions/cache@v4
        with:
          path: linux-${{ env.LINUX_VERSION }}.tar.xz
          key: linux-${{ env.LINUX_VERSION }}

      - name: Lay out the kernel
        env:
          DEB_SUITE: ${{ inputs.suite || 'trixie' }}
          EXTRA_FRAGMENTS: ${{ inputs.lockdep && format('{0}/drm/ci/lockdep.fragment', github.workspace) || '' }}
        run: |
          set -eux
          [ -f linux-$LINUX_VERSION.tar.xz ] ||
            curl -sfLO https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-$LINUX_VERSION.tar.xz
          tar xf linux-$LINUX_VERSION.tar.xz
          sh drm/ci/deb-kernel.sh "$PWD/linux-$LINUX_VERSION" "$PWD/drm" ${{ matrix.flavor }}

      - name: Build the packages
        env:
          DEBEMAIL: joseph@telaak.dev
          DEBFULLNAME: Joseph Telaak
        run: |
          set -eux
          # A snapshot sorts below every release (sgx0~git... < sgx0.1.0), so apt
          # moves from a CI build to the next release without --allow-downgrades.
          v=$(git rev-parse --short HEAD)
          d=$(git log -1 --format=%cd --date=format:%Y%m%d)
          make -C linux-$LINUX_VERSION ARCH=x86_64 -j"$(nproc)" LOCALVERSION=-sgx$FLAVOR \
            KDEB_PKGVERSION=${PKG_VERSION:-$LINUX_VERSION-${PKGTAG}0~git$d.$v} bindeb-pkg
          mkdir -p out
          mv linux-image-*.deb linux-headers-*.deb out/
          ls -l out

      - name: Check the packages
        run: |
          set -eux
          L=linux-$LINUX_VERSION
          # The display stays with gma500 (KMS and fbdev), rendering goes to powervr_sgx.
          for want in CONFIG_DRM_GMA500=m CONFIG_DRM_POWERVR_SGX=m CONFIG_DRM_POWERVR_SGX_GMA500=y \
              CONFIG_DRM_FBDEV_EMULATION=y CONFIG_AUXILIARY_BUS=y; do
            grep -qx "$want" $L/.config || { echo "missing $want"; exit 1; }
          done
          [ -z "$LOCKDEP" ] || grep -qx CONFIG_PROVE_LOCKING=y $L/.config
          rm -rf root && mkdir root && dpkg-deb -x out/linux-image-*.deb root
          M=$(ls -d root/lib/modules/*)
          for m in gma500_gfx powervr_sgx; do
            find $M -name "$m.ko*" | grep -q . || { echo "no $m module"; exit 1; }
          done
          P=$(find $M -name 'powervr_sgx.ko*')
          modinfo $P | tee modinfo.txt
          grep -q '^alias: *auxiliary:gma500_gfx.sgx' modinfo.txt
          grep -q '^alias: *pci:v00008086d0000089B' modinfo.txt
          grep -q '^firmware: *powervr_sgx/sgx545_ukernel.bin' modinfo.txt
          # udev loads powervr_sgx when gma500 publishes the SGX.
          depmod -b root "$(basename $M)"
          grep -q 'gma500_gfx.sgx' $M/modules.alias
          # gma500 can export scanout buffers (0002).
          G=$(find $M -name 'gma500_gfx.ko*')
          case $G in *.zst) zstd -dq $G -o g.ko ;; *.xz) xz -dc $G > g.ko ;; *) cp $G g.ko ;; esac
          nm g.ko | grep -q psb_gem_prime_get_sg_table
          nm g.ko | grep -q psb_gem_prime_export
          # The kit's patches are in the kit flavor only.
          if [ "$DEB_KIT" = 1 ]; then
            modinfo g.ko | grep -q '^parm: *cdv_sr:'
            grep -aq cdv_display_regs g.ko
          else
            if modinfo g.ko | grep -qE '^parm: *cdv_(sr|dsparb):' || grep -aq cdv_display_regs g.ko; then
              echo "kit patches in the release flavor"; exit 1
            fi
          fi
          ls out/linux-image-$LINUX_VERSION-sgx${FLAVOR}_*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: powervr-sgx-deb-cedarview-${{ matrix.flavor }}${{ env.LOCKDEP }}
          path: out/
          retention-days: 30
