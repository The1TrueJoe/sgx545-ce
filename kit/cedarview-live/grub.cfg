set timeout=10
set default=0
if [ "$grub_platform" = "efi" ]; then set gfxpayload=keep; fi
# The same test in each entry; they differ only in display settings. The kernel turns display
# self-refresh off by default (gma500 0005); cdv_sr=1 brings it back for comparison.
# Every line ends in systemd.show_status=0 (qemu-test.sh appends its options there).
menuentry "1. SGX545 test @VERSION@ (Debian 13 from this stick; changes nothing on this computer)" {
	linux /live/vmlinuz boot=live live-media=removable live-media-path=/live components noresume kit.entry=1 drm.debug=0x6 log_buf_len=4M quiet loglevel=3 systemd.show_status=0
	initrd /live/initrd.img
}
menuentry "2. The same test, with more display memory for the panel (cdv_dsparb=0x3f01)" {
	linux /live/vmlinuz boot=live live-media=removable live-media-path=/live components noresume kit.entry=2 gma500_gfx.cdv_dsparb=0x3f01 drm.debug=0x6 log_buf_len=4M quiet loglevel=3 systemd.show_status=0
	initrd /live/initrd.img
}
menuentry "3. The same test, display self-refresh on (the old setting, cdv_sr=1)" {
	linux /live/vmlinuz boot=live live-media=removable live-media-path=/live components noresume kit.entry=3 gma500_gfx.cdv_sr=1 drm.debug=0x6 log_buf_len=4M quiet loglevel=3 systemd.show_status=0
	initrd /live/initrd.img
}
menuentry "4. The same as 2, panel forced on (cdv_dsparb=0x3f01 video=LVDS-1:e)" {
	linux /live/vmlinuz boot=live live-media=removable live-media-path=/live components noresume kit.entry=4 gma500_gfx.cdv_dsparb=0x3f01 video=LVDS-1:e drm.debug=0x6 log_buf_len=4M quiet loglevel=3 systemd.show_status=0
	initrd /live/initrd.img
}
