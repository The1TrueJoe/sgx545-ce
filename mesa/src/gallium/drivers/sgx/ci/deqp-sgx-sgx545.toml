# dEQP-GLES2 on an SGX545 (Intel Atom CE5300, Cedarview): the run
# sgx-fails.txt, sgx-flakes.txt and sgx-skips.txt were made from
# (mesa/tests/deqp/run-deqp.sh does the same by hand).
[[deqp]]
deqp = "/deqp-gles/modules/gles2/deqp-gles2"
caselists = ["/deqp-gles/mustpass/gles2-main.txt"]
tests_per_group = 250
deqp_args = [
    "--deqp-surface-width=256", "--deqp-surface-height=256",
    "--deqp-surface-type=pbuffer", "--deqp-visibility=hidden",
    "--deqp-gl-config-name=rgba8888d24s8ms0",
]
version_check = "GL ES 2.0.*git"
renderer_check = "SGX545"
