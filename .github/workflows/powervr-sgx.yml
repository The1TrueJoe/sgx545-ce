# powervr_sgx: the CE5300 board kernel with the new DRM driver in tree, the
# driver again out of tree against it, and the uAPI tests. The artifact is a
# RAM-boot test set for an EA (bzImage, modules, tests); never flash it.
name: powervr-sgx

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      board:
        description: CE5300 board (ea1-v1, ea3-v2, ...)
        default: ea1-v1
      debug:
        description: Lockdep, KASAN, UBSAN, DMA-API debug and kmemleak (drm/ci/debug.fragment)
        type: boolean
        default: false
      linux:
        description: Kernel version (default 7.3.3)
        default: ''
  push:
    branches: [m2-drm]
    paths:
      - drm/**
      - docs/uapi/**
      - tools/gen/sgxgen.*
      - tools/tex/sgxtex.*
      - mesa/src/sgx/isa/sgx.xml
      - tools/isa/asm.py
      - tools/gen/mkusse.py
      - .github/workflows/powervr-sgx.yml

concurrency:
  group: powervr-sgx-${{ github.ref }}-${{ inputs.board || 'ea1-v1' }}-${{ inputs.debug && 'debug' || 'plain' }}-${{ inputs.linux || 'default' }}
  cancel-in-progress: true

env:
  LINUX_VERSION: ${{ inputs.linux || '7.3.3' }}
  DIST_REF: main
  BOARD: ${{ inputs.board || 'ea1-v1' }}
  SET: ${{ inputs.board || 'ea1-v1' }}${{ inputs.debug && '-debug' || '' }}${{ inputs.linux && format('-linux-{0}', inputs.linux) || '' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: The board tree (board config, patches, drivers)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BOARD_TREE_REPO || 'The1TrueJoe/openHC' }}
          ref: ${{ env.DIST_REF }}
          path: dist
          sparse-checkout: |
            board
            build

      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libelf-dev libssl-dev cpio ccache musl-tools sparse qemu-system-x86 python3-mako

      - name: Restore the kernel tarball
        uses: actions/cache@v4
        with:
          path: linux-${{ env.LINUX_VERSION }}.tar.xz
          key: linux-${{ env.LINUX_VERSION }}

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ env.LINUX_VERSION }}-${{ github.sha }}
          restore-keys: ccache-${{ env.LINUX_VERSION }}-

      - name: The validator's USSE table is current with the ISA description
        run: |
          python3 drm/tools/gen_usse_table.py mesa/src/sgx/isa/sgx.xml | diff -u drm/powervr_sgx/pvrsgx_usse_table.h -

      - name: Lay out the kernel
        run: |
          set -eux
          [ -f linux-$LINUX_VERSION.tar.xz ] ||
            curl -sfLO https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-$LINUX_VERSION.tar.xz
          tar xf linux-$LINUX_VERSION.tar.xz
          ${{ inputs.debug && 'export EXTRA_FRAGMENTS=$PWD/drm/ci/debug.fragment' || 'true' }}
          sh drm/ci/ce5300-kernel.sh "$PWD/dist" "$PWD/linux-$LINUX_VERSION" "$PWD/drm"

      - name: Build the kernel and modules
        run: |
          set -eux
          export CCACHE_DIR=~/.cache/ccache
          ccache -M 2G
          # A trial kernel (the linux input) keeps going, to list every break at once.
          make -C linux-$LINUX_VERSION ARCH=x86_64 CC="ccache gcc" KCFLAGS=-Werror=implicit-function-declaration \
            -j"$(nproc)" ${{ inputs.linux && '-k' || '' }} bzImage modules
          ccache -s

      - name: The driver out of tree, with W=1
        run: |
          set -eux
          make -C linux-$LINUX_VERSION ARCH=x86_64 M=$PWD/drm/powervr_sgx W=1 modules 2>&1 | tee oot.log
          if grep -E 'warning:|error:' oot.log; then exit 1; fi

      - name: The driver through sparse and checkpatch --strict
        run: |
          set -eux
          touch drm/powervr_sgx/*.c
          make -C linux-$LINUX_VERSION ARCH=x86_64 M=$PWD/drm/powervr_sgx C=2 modules 2>&1 | tee sparse.log
          if grep -E 'powervr_sgx/.*(warning|error):' sparse.log; then exit 1; fi
          perl linux-$LINUX_VERSION/scripts/checkpatch.pl --strict --no-tree --terse -f \
            $(ls drm/powervr_sgx/*.[ch] | grep -v -e _trace.h -e '\.mod\.c$') drm/powervr_sgx/tests/*.c \
            docs/uapi/powervr_sgx_drm.h docs/uapi/stream/*.[ch] | tee checkpatch.log
          if grep -E ': (ERROR|WARNING|CHECK):' checkpatch.log; then exit 1; fi
          python3 linux-$LINUX_VERSION/scripts/kernel-doc -none -Wall -Werror \
            docs/uapi/powervr_sgx_drm.h drm/powervr_sgx/pvrsgx_*.[ch]

      - name: KUnit (x86_64 under QEMU, a clean tree)
        run: |
          set -eux
          export CCACHE_DIR=~/.cache/ccache
          rm -rf kunit-src && mkdir kunit-src && tar xf linux-$LINUX_VERSION.tar.xz -C kunit-src
          K=kunit-src/linux-$LINUX_VERSION
          cp -RL drm/powervr_sgx $K/drivers/gpu/drm/powervr_sgx
          printf '\nsource "drivers/gpu/drm/powervr_sgx/Kconfig"\n' >> $K/drivers/gpu/drm/Kconfig
          printf '\nobj-$(CONFIG_DRM_POWERVR_SGX) += powervr_sgx/\n' >> $K/drivers/gpu/drm/Makefile
          cd $K
          ./tools/testing/kunit/kunit.py run --arch=x86_64 --jobs "$(nproc)" \
            --make_options "CC=ccache gcc" \
            --kunitconfig=drivers/gpu/drm/powervr_sgx/tests/.kunitconfig

      - name: sgx-asm, from sgx.xml (tools/gen/mkusse.py assembles with it)
        run: |
          set -eux
          sh ukernel/sgx-asm.sh "$RUNNER_TEMP/sgx-asm"
          echo "SGX_ASM=$RUNNER_TEMP/sgx-asm/sgx-asm" >> "$GITHUB_ENV"

      - name: uAPI tests (static, musl)
        run: |
          set -eux
          make -C linux-$LINUX_VERSION ARCH=x86_64 headers_install INSTALL_HDR_PATH=$PWD/hdr
          musl-gcc -static -O2 -fno-strict-aliasing -Wall -Wextra -Werror -I hdr/include -I hdr/include/drm -I drm/powervr_sgx/include/uapi/drm \
            -o powervr_sgx_test drm/tests/powervr_sgx_test.c
          musl-gcc -static -O2 -Wall -Wextra -Werror -I hdr/include -I hdr/include/drm -I drm/powervr_sgx/include/uapi/drm \
            -o powervr_sgx_pb drm/tests/powervr_sgx_pb.c
          # A real frame: tools/gen's frame builder on the DRM uAPI.
          python3 tools/gen/mkusse.py > tools/gen/usse_progs.h
          musl-gcc -static -O2 -fno-strict-aliasing -Wall -Wno-unused-function -DSGXGEN_DRM -I hdr/include -I hdr/include/drm \
            -I drm/powervr_sgx/include/uapi/drm -I tools/gen \
            -o powervr_sgx_frame drm/tests/powervr_sgx_frame.c tools/gen/sgxgen.c -lm
          # Transfer jobs: tools/tex's blit builder on the DRM uAPI.
          musl-gcc -static -O2 -fno-strict-aliasing -Wall -Wno-unused-function -I hdr/include -I hdr/include/drm \
            -I drm/powervr_sgx/include/uapi/drm -I tools/tex \
            -o powervr_sgx_blit drm/tests/powervr_sgx_blit.c tools/tex/sgxtex.c
          # Mixed render + transfer submits and hang recovery: both builders in one VM.
          musl-gcc -static -O2 -fno-strict-aliasing -Wall -Wno-unused-function -DSGXGEN_DRM -I hdr/include -I hdr/include/drm \
            -I drm/powervr_sgx/include/uapi/drm -I tools/gen -I tools/tex \
            -o powervr_sgx_hang drm/tests/powervr_sgx_hang.c tools/gen/sgxgen.c tools/tex/sgxtex.c -lm
          # PRIME with the KMS device (simpledrm): frames scanned out.
          musl-gcc -static -O2 -fno-strict-aliasing -Wall -Wno-unused-function -DSGXGEN_DRM -I hdr/include -I hdr/include/drm \
            -I drm/powervr_sgx/include/uapi/drm -I tools/gen \
            -o powervr_sgx_prime drm/tests/powervr_sgx_prime.c tools/gen/sgxgen.c -lm
          # The header on its own, as userspace sees it (layouts: docs/uapi/check.sh).
          echo '#include "powervr_sgx_drm.h"' | gcc -x c -fsyntax-only -Wall -Werror \
            -I hdr/include -I hdr/include/drm -I drm/powervr_sgx/include/uapi/drm -

      - name: Collect the RAM-boot set
        run: |
          set -eux
          L=linux-$LINUX_VERSION
          mkdir -p out/modules
          cp $L/arch/x86/boot/bzImage out/bzImage
          cp $L/.config out/config
          cp powervr_sgx_test powervr_sgx_frame powervr_sgx_blit powervr_sgx_hang powervr_sgx_prime powervr_sgx_pb out/
          for m in powervr_sgx gpu-sched drm_exec drm_gpuvm drm_shmem_helper; do
            find $L -name "$m.ko" -exec cp {} out/modules/ \;
          done
          strings $L/vmlinux | grep -m1 'Linux version' > out/version
          ls -l out out/modules
          cat out/version

      - uses: actions/upload-artifact@v4
        with:
          name: powervr-sgx-${{ env.SET }}
          path: out/
          retention-days: 14

