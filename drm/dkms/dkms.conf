# DKMS build of powervr_sgx against the running distribution kernel (7.1 or
# later). Make the source tree with drm/dkms/mkdkms.sh, not from a checkout:
# the shared stream files are symlinks there.
PACKAGE_NAME="powervr_sgx"
PACKAGE_VERSION="@VERSION@"
BUILT_MODULE_NAME[0]="powervr_sgx"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make KDIR=${kernel_source_dir} modules"
CLEAN="make KDIR=${kernel_source_dir} clean"
AUTOINSTALL="yes"
