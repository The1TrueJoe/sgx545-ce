set timeout=10
set default=0
if [ "$grub_platform" = "efi" ]; then set gfxpayload=keep; fi
# The same test in each entry; they differ only in display settings, the likeliest fix first.
# Every line ends in systemd.show_status=0 (qemu-test.sh appends its options there).
menuentry "1. SGX545 test @VERSION@, display self-refresh off (Debian 13 from this stick; changes nothing on this computer)" {
	linux /live/vmlinuz boot=live live-media=removable live-media-path=/live components noresume kit.entry=1 gma500_gfx.cdv_sr=0 drm.debug=0x6 log_buf_len=4M quiet loglevel=3 systemd.show_status=0
	initrd /live/initrd.img
}
menuentry "2. The same test, display self-refresh on (the kernel's default)" {
	linux /live/vmlinuz boot=live live-media=removable live-media-path=/live components noresume kit.entry=2 drm.debug=0x6 log_buf_len=4M quiet loglevel=3 systemd.show_status=0
	initrd /live/initrd.img
}
menuentry "3. The same as 1, panel forced on (video=LVDS-1:e)" {
	linux /live/vmlinuz boot=live live-media=removable live-media-path=/live components noresume kit.entry=3 gma500_gfx.cdv_sr=0 video=LVDS-1:e drm.debug=0x6 log_buf_len=4M quiet loglevel=3 systemd.show_status=0
	initrd /live/initrd.img
}
menuentry "4. The same as 2, backlight through the GPU (acpi_backlight=native)" {
	linux /live/vmlinuz boot=live live-media=removable live-media-path=/live components noresume kit.entry=4 acpi_backlight=native drm.debug=0x6 log_buf_len=4M quiet loglevel=3 systemd.show_status=0
	initrd /live/initrd.img
}
