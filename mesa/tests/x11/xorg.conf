# Xorg on the EA's boot framebuffer (simpledrm), rendering with glamor on our
# Mesa (kmsro pairs simpledrm with powervr_sgx); no input devices.
Section "ServerFlags"
	Option "AutoAddDevices" "false"
	Option "AutoEnableDevices" "false"
	Option "AllowEmptyInput" "true"
EndSection

Section "Device"
	Identifier "fb"
	Driver "modesetting"
	Option "kmsdev" "/dev/dri/card0"
	Option "AccelMethod" "glamor"
EndSection
