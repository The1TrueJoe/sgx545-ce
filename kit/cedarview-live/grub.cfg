set timeout=3
set default=0
if [ "$grub_platform" = "efi" ]; then set gfxpayload=keep; fi
# One entry, booted by itself: the run tries every display and desktop variant on its own
# (kit-live-run, desktop-variants) and turns the computer off at the end.
# The line ends in systemd.show_status=0 (qemu-test.sh appends its options there).
menuentry "SGX545 test @VERSION@ (Debian 13 from this stick; changes nothing on this computer)" {
	linux /live/vmlinuz boot=live live-media=removable live-media-path=/live components noresume drm.debug=0x6 log_buf_len=4M quiet loglevel=3 systemd.show_status=0
	initrd /live/initrd.img
}
