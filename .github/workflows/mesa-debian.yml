# Mesa with the sgx driver for Debian 13 (trixie) users: built natively in a
# trixie container (mesa/build.sh debian) for /opt/sgx, packed with the two files
# that put it ahead of Debian's Mesa (mesa/debian/package.sh, etc.<arch>), for
# amd64 and for i386 (32-bit games; Multi-Arch: same, installed beside amd64's).
# docs/INSTALL.md.
name: mesa-debian

on:
  workflow_dispatch:
  # release.yml builds the release packages through this.
  workflow_call:
    inputs:
      release_version:
        description: the release's version without the v (0.1.0); empty for a git snapshot
        type: string
        default: ''
    outputs:
      artifact:
        description: the name of the artifact holding the packages
        value: mesa-sgx-trixie
  push:
    branches: [dev, main]
    paths:
      - mesa/**
      - drm/powervr_sgx/include/uapi/**
      - drm/tools/mkukfw.py
      - ukernel/**
      - docs/uapi/**
      - tools/gen/**
      - .github/workflows/mesa-debian.yml

permissions:
  contents: read

jobs:
  mesa:
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 90
    steps:
      - name: Build dependencies
        run: |
          set -eux
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git perl patch xz-utils python3 python3-mako python3-yaml python3-packaging \
            meson ninja-build pkg-config bison flex gcc g++ glslang-tools \
            libdrm-dev libglvnd-dev libx11-dev libxext-dev libxfixes-dev libxdamage-dev libxrandr-dev \
            libxxf86vm-dev libxshmfence-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-dri3-dev \
            libxcb-present-dev libxcb-sync-dev libxcb-glx0-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libxcb-shm0-dev libxcb-keysyms1-dev libwayland-dev wayland-protocols libwayland-egl-backend-dev \
            libexpat1-dev zlib1g-dev libzstd-dev libudev-dev llvm-19-dev libclang-cpp19-dev libelf-dev

      - uses: actions/checkout@v4

      - name: Build
        run: |
          set -eux
          SGX_MESA_BUILD=$PWD/build/mesa sh mesa/build.sh debian

      # Cedarview: the display is gma500 (PCI) and powervr_sgx sits on an
      # auxiliary device of its function, which libdrm doesn't describe. The
      # loader's pick of that render node and its description of the device
      # (fake sysfs trees, one the layout of a real D2500), and the stub an X
      # server's GLX loads.
      - name: Render-node pick, the Cedarview device and the gma500 stub
        run: |
          set -eux
          test -e build/mesa/debian/install/opt/sgx/lib/dri/gma500_dri.so
          meson configure build/mesa/debian/build -Dbuild-tests=true
          ninja -C build/mesa/debian/build src/loader/loader_child_render_node_test \
            src/loader/loader_cedarview_sysfs_test
          build/mesa/debian/build/src/loader/loader_child_render_node_test
          build/mesa/debian/build/src/loader/loader_cedarview_sysfs_test

      - name: The firmware (the open microkernel, secure mode, assembled through sgx-asm)
        env:
          RELEASE: ${{ inputs.release_version }}
        run: |
          set -eux
          v=$(git -c safe.directory='*' rev-parse --short HEAD)
          [ -z "$RELEASE" ] || v=v$RELEASE
          mkdir -p fw
          # Shipped firmware is assembled through sgx-asm (built from sgx.xml), the
          # clean-room path, not the asm.py oracle. Reuse the mesa tree the Build
          # step unpacked (it carries our mesa/src overlays).
          . mesa/VERSION
          mesa/tests/isa-standalone/standalone.sh "$PWD/build/mesa/mesa-$MESA_VERSION" "$PWD/isa-build"
          export SGX_ASM="$PWD/isa-build/sgx-asm"
          python3 ukernel/build.py fw/uk.bin fw/uk.json
          grep -q '"assembler": "sgx-asm"' fw/uk.json   # the shipped image must come from sgx.xml
          python3 drm/tools/mkukfw.py fw/uk.bin -o sgx545_ukernel.bin --manifest fw/uk.json \
            --core-rev 0 --build-id "ukernel-$v"
          python3 drm/tools/mkukfw.py --check sgx545_ukernel.bin | tee fw/check.txt
          # features word <= the in-tree driver's accepted mask (not a hardcoded
          # literal): the firmware and the kernel in this release move together.
          python3 drm/tools/ukfw_features_pin.py --image sgx545_ukernel.bin

      - name: Packages (.deb)
        env:
          RELEASE: ${{ inputs.release_version }}
        run: |
          set -eux
          v=$(git -c safe.directory='*' rev-parse --short HEAD)
          d=$(git -c safe.directory='*' log -1 --format=%cd --date=format:%Y%m%d)
          mv=$(. mesa/VERSION; echo "$MESA_VERSION")
          # A release names its packages by the release; a snapshot by date and commit.
          if [ -n "$RELEASE" ]; then mver=$mv+sgx$RELEASE fver=$RELEASE; else mver=$mv+sgx$d.$v fver=0~git$d.$v; fi
          # mesa-sgx: /opt/sgx and the two files that put it ahead of Debian's Mesa
          sh mesa/debian/package.sh build/mesa/debian/install amd64 "$mver"

          # sgx545-firmware: the open microkernel
          F=$PWD/deb/fw
          mkdir -p $F/DEBIAN $F/lib/firmware/powervr_sgx
          cp sgx545_ukernel.bin $F/lib/firmware/powervr_sgx/
          cat > $F/DEBIAN/control <<CTL
          Package: sgx545-firmware
          Version: $fver
          Architecture: all
          Maintainer: Joseph Telaak <joseph@telaak.dev>
          Section: kernel
          Priority: optional
          Description: Open microkernel for the PowerVR SGX545 (powervr_sgx)
           The GPU firmware the powervr_sgx kernel driver loads, built from source
           (MIT). No Intel or Imagination code.
          CTL
          sed -i 's/^          //' $F/DEBIAN/control
          printf '#!/bin/sh\nset -e\nif command -v update-initramfs >/dev/null; then update-initramfs -u; fi\n' > $F/DEBIAN/postinst
          cp $F/DEBIAN/postinst $F/DEBIAN/postrm
          chmod 755 $F/DEBIAN/postinst $F/DEBIAN/postrm
          dpkg-deb --root-owner-group --build $F sgx545-firmware_${fver}_all.deb

          for f in *.deb; do dpkg-deb -I $f | head -12; dpkg-deb -c $f | head -8; done

      - uses: actions/upload-artifact@v4
        with:
          name: mesa-sgx-amd64
          path: '*.deb'
          retention-days: 7

  # 32-bit programs (GoldSrc and other i386 games, their steam-runtime) load an
  # i386 Mesa. Built natively in an i386 trixie container (actions can't run
  # inside one, so the host drives docker), libdir lib/i386-linux-gnu.
  mesa-i386:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build and pack (i386)
        env:
          RELEASE: ${{ inputs.release_version }}
        run: |
          set -eux
          v=$(git rev-parse --short HEAD)
          d=$(git log -1 --format=%cd --date=format:%Y%m%d)
          mv=$(. mesa/VERSION; echo "$MESA_VERSION")
          if [ -n "$RELEASE" ]; then mver=$mv+sgx$RELEASE; else mver=$mv+sgx$d.$v; fi
          docker run --rm --platform linux/386 -v "$PWD:/w" -w /w -e MVER="$mver" debian:trixie \
            setarch i686 sh -c '
              set -eux
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates curl perl patch xz-utils python3 python3-mako python3-yaml python3-packaging \
                meson ninja-build pkg-config bison flex gcc g++ glslang-tools dpkg-dev file \
                libdrm-dev libglvnd-dev libx11-dev libxext-dev libxfixes-dev libxdamage-dev libxrandr-dev \
                libxxf86vm-dev libxshmfence-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-dri3-dev \
                libxcb-present-dev libxcb-sync-dev libxcb-glx0-dev libxcb-randr0-dev libxcb-xfixes0-dev \
                libxcb-shm0-dev libxcb-keysyms1-dev libwayland-dev wayland-protocols libwayland-egl-backend-dev \
                libexpat1-dev zlib1g-dev libzstd-dev libudev-dev llvm-19-dev libclang-cpp19-dev libelf-dev
              [ "$(dpkg --print-architecture)" = i386 ]
              SGX_MESA_BUILD=/w/build/mesa SGX_MESA_LIBDIR=lib/i386-linux-gnu sh mesa/build.sh debian
              file build/mesa/debian/install/opt/sgx/lib/i386-linux-gnu/libgallium-*.so | grep -q "ELF 32-bit"
              sh mesa/debian/package.sh build/mesa/debian/install i386 "$MVER"
              dpkg-deb -I mesa-sgx_*_i386.deb | head -12
              dpkg-deb -c mesa-sgx_*_i386.deb | head -12
            '

      - uses: actions/upload-artifact@v4
        with:
          name: mesa-sgx-i386
          path: '*.deb'
          retention-days: 7

  # Both architectures in one trixie system, as a user installs them for a
  # 32-bit game, then the checksums and the artifact release.yml takes.
  packages:
    needs: [mesa, mesa-i386]
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mesa-sgx-amd64
      - uses: actions/download-artifact@v4
        with:
          name: mesa-sgx-i386

      - name: Install amd64 and i386 together
        run: |
          set -eux
          ls -l
          dpkg --add-architecture i386
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ./mesa-sgx_*_amd64.deb ./mesa-sgx_*_i386.deb
          dpkg -l 'mesa-sgx*' | grep '^ii'
          [ "$(dpkg -l 'mesa-sgx*' | grep -c '^ii')" = 2 ]
          # each architecture's driver, and ld.so finding ours ahead of the system's
          test -e /opt/sgx/lib/dri/gma500_dri.so
          test -e /opt/sgx/lib/i386-linux-gnu/dri/gma500_dri.so
          ldconfig -p | grep 'libEGL_mesa.so.0 (libc6,x86-64) => /opt/sgx/lib/libEGL_mesa'
          ldconfig -p | grep 'libEGL_mesa.so.0 (libc6) => /opt/sgx/lib/i386-linux-gnu/libEGL_mesa'
          # removing one leaves the other whole, the shared /opt/sgx/share too
          find /opt/sgx/share -type f | sort > share.txt
          [ -s share.txt ]
          apt-get remove -y mesa-sgx:i386
          test -e /opt/sgx/lib/dri/gma500_dri.so
          find /opt/sgx/share -type f | sort | diff share.txt -
          rm share.txt

      - name: Checksums
        run: |
          set -eux
          sha256sum *.deb > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: mesa-sgx-trixie
          path: |
            *.deb
            SHA256SUMS
          retention-days: 90
