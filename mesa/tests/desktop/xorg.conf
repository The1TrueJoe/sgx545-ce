# Xorg on the boot framebuffer (simpledrm, card0), rendering with glamor on our
# Mesa (kmsro pairs simpledrm with powervr_sgx); keyboard and mouse through
# libinput and udev.
Section "Device"
	Identifier "fb"
	Driver "modesetting"
	Option "kmsdev" "/dev/dri/card0"
	Option "AccelMethod" "glamor"
EndSection
