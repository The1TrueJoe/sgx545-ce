# The microkernel's ISA gate: sgx.xml's own tests, and every build variant of
# ukernel/ assembled through sgx-asm (built from sgx.xml), which refuses any
# instruction sgx.xml doesn't cover.
name: ukernel-isa-gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ukernel/**
      - tools/isa/**
      - mesa/src/sgx/isa/**
      - mesa/tests/isa-standalone/**
      - mesa/patches/*isaspec*
      - .github/workflows/ukernel-isa-gate.yml
  push:
    branches: [dev, main]
    paths:
      - ukernel/**
      - tools/isa/**
      - mesa/src/sgx/isa/**
      - mesa/tests/isa-standalone/**
      - mesa/patches/*isaspec*
      - .github/workflows/ukernel-isa-gate.yml

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-mako
      - uses: actions/cache@v4
        with:
          path: mesa-src.tar.xz
          key: mesa-${{ hashFiles('mesa/VERSION') }}
      - name: Mesa release
        run: |
          set -eu
          . mesa/VERSION
          [ -f mesa-src.tar.xz ] || curl -sfL -o mesa-src.tar.xz "$MESA_URL"
          echo "$MESA_SHA256  mesa-src.tar.xz" | sha256sum -c
          tar xf mesa-src.tar.xz
          mv "mesa-$MESA_VERSION" mesa-tree
      - name: sgx_isa_test
        run: |
          mesa/tests/isa-standalone/standalone.sh "$PWD/mesa-tree" "$PWD/isa-build"
          isa-build/sgx_isa_test mesa/src/sgx/isa/tests/*.txt
      - name: Every build variant assembles through sgx-asm
        run: |
          set -eu
          export SGX_ASM=$PWD/isa-build/sgx-asm
          mkdir -p fw
          python3 -I ukernel/build.py fw/uk.bin fw/uk.json
          for v in $(grep -oE 'environ.get\("UK_[A-Z0-9_]+"\) == "1"' ukernel/*.py | grep -oE 'UK_[A-Z0-9_]+' | sort -u); do
            echo "== $v"
            env "$v=1" python3 -I ukernel/build.py "fw/$v.bin" "fw/$v.json"
          done
          echo "== every variant on"
          env $(grep -oE 'environ.get\("UK_[A-Z0-9_]+"\) == "1"' ukernel/*.py | grep -oE 'UK_[A-Z0-9_]+' | sort -u | sed 's/$/=1/') \
            python3 -I ukernel/build.py fw/all.bin fw/all.json
