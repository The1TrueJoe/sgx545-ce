# The SGX545 serial microkernel image is byte-for-byte reproducible from source.
# CI rebuilds it and fails on any drift from the recorded golden hash
# (ukernel/golden/sgx545.sha256) -- the image itself is never checked in -- so a
# refactor meant to preserve the image is caught the moment it does not. Every
# later tooling step (core config, symbolic assembler, assembling through the
# ISA description) is gated on this check staying green.
name: ukernel-golden

on:
  push:
    branches: [dev, main]
    paths:
      - ukernel/**
      - mesa/src/sgx/isa/**
      - mesa/tests/isa-standalone/**
      - .github/workflows/ukernel-golden.yml
  pull_request:
    paths:
      - ukernel/**
      - mesa/src/sgx/isa/**
      - mesa/tests/isa-standalone/**

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: sgx-asm, from sgx.xml (ukernel/build.py assembles with it)
        run: |
          set -eux
          python3 -m pip install -q mako
          sh ukernel/sgx-asm.sh "$RUNNER_TEMP/sgx-asm"
          echo "SGX_ASM=$RUNNER_TEMP/sgx-asm/sgx-asm" >> "$GITHUB_ENV"
      - name: Rebuild the SGX545 serial image and verify its hash
        run: python3 ukernel/golden/check.py
      - name: Rebuild the SGX530 image and verify its hash
        run: python3 ukernel/golden/check.py sgx530
      - name: SGX530 per-core paths in the emulator
        run: python3 ukernel/test_sgx530.py
