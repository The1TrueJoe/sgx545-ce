# Mesa's sgx driver for the SGX530 of our OMAP3630 test board: an ARMv7
# hard-float musl cross build (mesa/build.sh armv7: zig cc, Cortex-A8; the
# board's userspace is musl), powervr_sgx backend only. The
# artifact carries the libraries plus the winsys tests (sgx_frame_test,
# sgx_hwt) that tools/isa/hwt_open.py drives on the board.
name: mesa-armv7

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [dev, main, sgx530]
    paths:
      - mesa/**
      - drm/powervr_sgx/include/uapi/**
      - docs/uapi/**
      - tools/gen/**
      - .github/workflows/mesa-armv7.yml
  pull_request:
    paths:
      - mesa/**
      - .github/workflows/mesa-armv7.yml

concurrency:
  group: mesa-armv7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          set -eux
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ninja-build pkg-config bison flex python3-pip python3-mako python3-yaml python3-packaging
          # Mesa needs meson >= 1.4; the runner's is 1.3
          pip3 install --user --break-system-packages 'meson==1.5.2'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: |
          set -eux
          SGX_MESA_BUILD=$PWD/build/mesa sh mesa/build.sh armv7
          file build/mesa/armv7/install/usr/lib/sgx_hwt | grep 'ARM, EABI5'

      - uses: actions/upload-artifact@v4
        with:
          name: mesa-sgx-armv7
          path: build/mesa/armv7/install/usr
          if-no-files-found: error
