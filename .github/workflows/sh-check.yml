# Every /bin/sh script under kit/, mesa/tests/ and tools/release/ parses under dash (Debian's
# sh, stricter than bash), every bash script under bash.
name: sh-check

on:
  workflow_dispatch:
  push:
    branches: [dev, main]
    paths:
      - kit/**
      - mesa/tests/**
      - tools/release/**
      - .github/workflows/sh-check.yml
  pull_request:
    paths:
      - kit/**
      - mesa/tests/**
      - tools/release/**

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: dash -n and bash -n
        run: |
          rc=0
          for f in $(git ls-files kit mesa/tests tools/release); do
            case $(head -c 64 "$f" | head -1) in
            '#!/bin/sh'*) dash -n "$f" || { echo "::error file=$f::does not parse under dash"; rc=1; } ;;
            '#!/bin/bash'*|'#!/usr/bin/env bash'*) bash -n "$f" || { echo "::error file=$f::does not parse under bash"; rc=1; } ;;
            esac
          done
          exit $rc
